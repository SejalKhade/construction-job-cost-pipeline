name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4   # PySpark needs a JVM
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile dbt project (fails on bad SQL or YAML)
        working-directory: dbt_project
        run: dbt parse --profiles-dir .

      - name: End-to-end pipeline tests (Dagster -> PySpark -> dbt build -> checks)
        run: pytest -v -p no:warnings
