name: jobcost
version: "1.0.0"
config-version: 2
profile: jobcost

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  max_quarantine_rate_pct: 2.0   # business rule: alert if more than 2% of cost rows are rejected

models:
  jobcost:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
